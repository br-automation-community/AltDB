services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: altdb-mssql
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong@Passw0rd
      - MSSQL_FORCE_ENCRYPTION=0
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"YourStrong@Passw0rd\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  init-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: altdb-init
    depends_on:
      mssql:
        condition: service_healthy
    volumes:
      - ./init.sql:/init.sql
    entrypoint: >
      /bin/bash -c "
        /opt/mssql-tools18/bin/sqlcmd -S mssql -U sa -P 'YourStrong@Passw0rd' -C -i /init.sql
        echo 'TestDb database created and configured with COMPATIBILITY_LEVEL = 120.'
      "
